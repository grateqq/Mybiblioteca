<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Library</h1>
  <button id="add-book-btn">Agregar Libro</button>
  <div id="container"></div>
  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2>Agregar un nuevo libro</h2>
      <label for="title">title: </label>
      <input type="text" name="title" placeholder="title" value="El Principito" required>
      <label for="author">Author: </label>
      <input type="text" name="author" placeholder="autor" value="Hakicho" required>
      <label for="pages">Pages: </label>
      <input type="number" name="pages" placeholder="pages" value="1000" required>
      <label for="year">Year: </label>
      <input type="number" name="year" placeholder="year" value="1950" required>
      <label for="read">
      <input type="checkbox" id="read" placeholder="read" checked> Leido?
      </label>
      <div>
        <button type="submit" id="agregar-btn">Agregar</button>
        <button type="button" id="cancel-btn">Cancelar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
